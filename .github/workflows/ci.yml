name: CI

# Cost-constrained by design (SPEC §Constraints): lint, type-check and the
# non-live test markers only. Promptfoo evals and live e2e never run here.
#
# The Postgres service below is a deliberate addition to that budget. Without
# it CI set SKIP_DB_TESTS=1, and as the build grew that silently skipped 34 of
# 153 tests — every data-layer, ingress and grounding test — so a green CI run
# was evidence of far less than it appeared. One service container costs a few
# seconds per run; a green tick that does not cover the data layer costs more.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: othram
          POSTGRES_PASSWORD: othram
          POSTGRES_DB: othram
        ports:
          - 5432:5432
        # The job does not start until this reports healthy, so the test
        # suite never races the container's startup.
        options: >-
          --health-cmd "pg_isready -U othram -d othram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://othram:othram@localhost:5432/othram
      # Deliberately NOT setting SKIP_DB_TESTS: the database-backed tests
      # must actually run here.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Two invocations, because `extend-exclude` in pyproject.toml is
      # gitignore-style: the bare entry `"portal"` matches ANY directory named
      # portal at any depth, so it silently swallows backend/src/portal/ and
      # backend/tests/portal/ — Python, not the Vite app. `ruff check .` reports
      # 124 files and none of those 19, which had therefore never been linted
      # here. The second line is what `.claude/rules/build-protocol.md` rule 2
      # has always required of a local commit; this step just stopped being the
      # weaker gate. backend/tests/test_ci_workflow.py checks the coverage by
      # measurement rather than trusting either pattern.
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff check backend/src/portal backend/tests/portal

      - name: Type-check
        run: uv run mypy backend

      # T-19: portal/src/api-types.ts must be generated from
      # backend/src/portal/schemas.py, not hand-edited. --check never
      # writes; it fails the build if the committed file is stale.
      - name: Portal API contract parity
        run: uv run python backend/src/portal/codegen.py --out portal/src/api-types.ts --check

      # Single run — `-rs` reports skip reasons so the guard below can read
      # them without paying for a second full pass of the suite. `--color=no`
      # pins what is already true here (piping through `tee` makes stdout a
      # pipe, so --color=auto resolves to no colour) so that /tmp/pytest.out
      # stays plain text for the two guards that parse it, whatever a future
      # runner image, `uv`, or a FORCE_COLOR/PY_COLORS in the environment does.
      - name: Test
        run: |
          set -o pipefail
          uv run pytest -m "not live" -rs --color=no 2>&1 | tee /tmp/pytest.out

      # A skip is not a pass. If the database-backed tests ever start skipping
      # in CI again, fail loudly rather than shipping a hollow green tick.
      #
      # Match the skip REASON `-rs` prints, never a bare substring. This guard
      # was `grep -qi "SKIP_DB_TESTS"`, which matched the ordinary progress line
      # of the test module named after the variable —
      #     backend/tests/test_skip_db_tests_relocation.py ....       [  3%]
      # — so the filename alone failed run 32003095488, in which all 511 tests
      # had in fact run against the Postgres service above and nothing skipped.
      #
      # `-rs` prints one summary line per distinct skip reason, in two shapes:
      #     SKIPPED [8] backend/tests/graph/test_tracing.py: <reason>
      #     SKIPPED [1] backend/tests/data/test_lookup.py:27: <reason>
      # (no line number when the skip came from the
      # `pytest_collection_modifyitems` hook in backend/tests/conftest.py, one
      # when it came from a `skipif`). The pattern requires that whole structure
      # — SKIPPED token, [count], `path[:lineno]:` — and then matches inside the
      # reason, which a path or test id containing the string cannot satisfy.
      # Every database skip in the suite carries the one reason "requires the
      # docker-compose db service (CI sets SKIP_DB_TESTS=1)" (that hook plus the
      # `skipif` sites under backend/tests/data|graph|grounding|ingress|portal),
      # so either alternative catches all of them. `SKIP_DB_TESTS` is matched
      # case-sensitively on purpose: the env var is upper case, the paths that
      # used to false-positive are lower case.
      #
      # No `^` anchor, and `.*` between SKIPPED and [count], both deliberate:
      # with colour on pytest wraps that one word, emitting
      #     <ESC>[33mSKIPPED<ESC>[0m [8] backend/tests/graph/...: <reason>
      # against which BOTH `^SKIPPED` and a literal `SKIPPED [` adjacency match
      # nothing at all — a guard that cannot fire, which is worse than no guard.
      # Colour is off here twice over (the `tee` pipe, plus --color=no above) but
      # the matcher must not depend on that staying true. The escapes cannot fool
      # `\[[0-9]+\]`: `[33m` and `[0m` have no `]` after their digits, and the
      # count, path and reason are never coloured.
      #
      # Not -q, so the matched lines are printed as diagnostics.
      - name: Assert database tests actually ran
        run: |
          if grep -nE 'SKIPPED.*\[[0-9]+\] [^ ]+: .*(SKIP_DB_TESTS|docker-compose db service)' /tmp/pytest.out; then
            echo "::error::Database-backed tests were skipped — the Postgres service is not reachable. The offending SKIPPED reasons are printed above."
            exit 1
          fi

      # A near-empty collected count is not a pass either — a broken
      # testpaths config or a conftest import error can silently collect
      # (and "pass") almost nothing while still exiting 0. 200 is comfortably
      # below the real count at the time this floor was added (467 tests),
      # leaving headroom for normal fluctuation while still catching a
      # catastrophic collection failure.
      - name: Assert a healthy number of tests actually ran
        run: |
          count=$(grep -oE '[0-9]+ passed' /tmp/pytest.out | tail -1 | grep -oE '[0-9]+')
          echo "Collected/passed count: ${count:-0}"
          if [ -z "$count" ] || [ "$count" -lt 200 ]; then
            echo "::error::Only ${count:-0} tests passed — expected at least 200. Collection may be broken."
            exit 1
          fi

      # T-19: the portal contract parity check above only proves the
      # generated TYPES match the backend; these steps prove the portal
      # actually still builds and its own test suite still passes.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Portal build (type-check + bundle)
        working-directory: portal
        run: npm run build

      - name: Portal tests
        working-directory: portal
        run: npm test
