[project]
name = "othram-support-agent"
version = "0.1.0"
description = "Autonomous AI support agent for a fictional forensic-genomics lab"
requires-python = ">=3.12,<3.13"

# The full dependency set for every ticket lands here: pyproject.toml is in
# T-0's scope alone, so no later ticket can add a dependency without a scope
# violation.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "anthropic>=0.75",
    "langfuse>=4.0,<5",
    # W1-A / ADR-002: the webhook enqueues onto Redis and a dedicated arq
    # worker consumes the job and calls run_agent. `redis` is arq's own
    # transitive dependency but is declared explicitly because
    # backend/src/worker/settings.py imports arq's RedisSettings directly
    # and the deploy stack runs a redis service of its own.
    "arq>=0.26",
    "redis>=5.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Dependencies only — components are imported from backend/src via pythonpath,
# not installed as a distribution.
package = false

[tool.pytest.ini_options]
# testpaths keeps collection out of portal/ and node_modules/ entirely.
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
# importlib import mode lets every ticket add backend/tests/<area>/ without
# __init__.py files and without basename collisions between areas.
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "contract: HelpdeskPort contract suite, parametrized over adapters (T-2/T-3)",
    "grounding: R9 grounding invariant and its adversarial set (T-5)",
    "live: live e2e against the real Zendesk trial; never runs in CI (T-10)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# ".claude" is the vendored cc-factory build harness, not product code. It
# arrived with commit c44f9af in a deliberately compact style (compound
# statements, long lines) that this project's rules reject, and rule 1 of
# .claude/rules/harness-protocol.md forbids any session from editing it — so
# every ticket's `ruff check .` would fail on files no ticket is allowed to
# fix. Excluded here for the same reason "portal" and ".venv" are: this linter
# governs the code the plan owns. The harness used to carry its own coverage,
# but that suite is retired too — docs/DECISIONS.md ADR-019 moved it to
# .claude/harness-archive/hooks-tests/, which this exclude also covers, so the
# archive is preserved verbatim rather than relinted.
extend-exclude = ["portal", ".venv", ".claude"]
# Mirrors [tool.pytest.ini_options].pythonpath so isort recognizes modules
# resolved from backend/src and the repo root (main, ingress, portal, ...)
# as first-party rather than third-party.
src = ["backend/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend/src"
explicit_package_bases = true
namespace_packages = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["pgvector.*", "langfuse.*", "sklearn.*", "matplotlib.*", "respx.*"]
ignore_missing_imports = true
