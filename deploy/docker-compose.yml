# Production stack for the Othram AI Support Agent (T-11).
#
# W1-F1/F2 (2026-08-16) added three services to the original db/backend/portal
# set: `redis` (arq broker, ADR-002), `worker` (the same backend image with an
# arq command, ADR-002) and `cloudflared` (named tunnel, ADR-005). The
# cloudflared service has NEVER been run — see its own comment block and
# docs/OWNER-ACTIONS.md OA-3.
#
# Every env var the application reads must be forwarded to every container
# running the application image. That is not a convention here, it is
# asserted by backend/tests/deploy/test_env_forwarding.py, which derives the
# variable list from the source rather than from a list anyone maintains.
#
# Self-contained under deploy/ per SPEC#constraints: the root
# docker-compose.yml (T-0) is dev-only — a bare Postgres container the
# test suite points at — and out of this ticket's edit scope. This file
# is the whole production stack: Postgres 16 + pgvector, the FastAPI
# backend, and the portal (built to static files, served by nginx).
#
# --- Isolation from the dev stack (T-0's docker-compose.yml) ---
# - `name:` below pins the compose PROJECT name to `othram-deploy`
#   regardless of the directory this is invoked from, so its network,
#   default volume names, and `docker compose down` scope never collide
#   with the dev stack's project (whatever directory-derived name that
#   resolves to).
# - Every `container_name` is `othram-deploy-*`, distinct from the dev
#   stack's `othram-db`.
# - The `db` service here has no `ports:` mapping at all — it is reachable
#   only from `backend` over the internal `othram-deploy` network, at
#   hostname `db`. The dev stack's Postgres keeps host port 5432 to
#   itself; this stack never binds it, so the two can run at the same
#   time without a port conflict.
# - `deploy_pgdata` is a project-scoped named volume (fully distinct from
#   the dev stack's `pgdata`), so bringing this stack up/down can never
#   read or clobber dev data.
#
# --- Env vars ---
# Every `${VAR}` below is read from the shell environment `docker compose`
# runs in — NOT baked into any image (no secrets in `deploy/Dockerfile.*`).
# Populate them by sourcing the repo-root `.env` before running compose,
# the same idiom `.env.example` already documents for `doctl`:
#
#     set -a; source .env; set +a
#     docker compose -f deploy/docker-compose.yml up -d --build
#
# See docs/deploy.md for the full list of vars, what each one does, and
# how to supply them safely on a droplet (never committed, never baked
# into an image layer).
name: othram-deploy

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: othram-deploy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-othram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-othram}
      POSTGRES_DB: ${POSTGRES_DB:-othram}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-othram} -d ${POSTGRES_DB:-othram}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - deploy_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - othram-deploy

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: othram-deploy-backend
    environment:
      # Internal service DNS name (`db`), not `localhost` — the dev
      # stack's own `DATABASE_URL` (root .env, pointed at
      # localhost:5432 for `docker compose up -d db`) would resolve to
      # this CONTAINER's own loopback, not the host's dev Postgres, so it
      # is deliberately never referenced here; this is built fresh from
      # the POSTGRES_* parts against the `db` service above instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-othram}:${POSTGRES_PASSWORD:-othram}@db:5432/${POSTGRES_DB:-othram}
      PORTAL_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
      # Zendesk OAuth — all four may be empty (as they are in this
      # environment: no live Zendesk trial). Every read of these
      # (backend/src/ingress/__init__.py, backend/src/helpdesk/
      # zendesk_adapter.py) happens at REQUEST time, never at import/
      # startup, so the app starts and serves /health with none of them
      # set — it just 500s the specific endpoints that need a given var
      # (e.g. the webhook needs ZENDESK_WEBHOOK_SIGNING_SECRET) until
      # docs/zendesk-runbook.md has been completed by a human.
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_OAUTH_TOKEN: ${ZENDESK_OAUTH_TOKEN:-}
      # ZENDESK_OAUTH_TOKEN expires 30 minutes after issue (it is a JWT with a
      # single `exp` claim). These three are the renewal credential
      # backend/src/helpdesk/zendesk_credentials.py spends to replace it, so a
      # container outlives a single token. Empty is tolerated on the same
      # request-time terms as the rest of this block.
      ZENDESK_OAUTH_REFRESH_TOKEN: ${ZENDESK_OAUTH_REFRESH_TOKEN:-}
      ZENDESK_OAUTH_CLIENT_ID: ${ZENDESK_OAUTH_CLIENT_ID:-}
      ZENDESK_OAUTH_CLIENT_SECRET: ${ZENDESK_OAUTH_CLIENT_SECRET:-}
      # Where the ROTATED pair would be persisted (see the
      # deploy_zendesk_tokens volume). Path, not a secret; it must sit on the
      # shared volume mounted below. Forwarded on every service running this
      # image because the application reads the name
      # (backend/tests/deploy/test_env_forwarding.py requires that), but
      # deliberately EMPTY — see below.
      #
      # NO `:-` DEFAULT VALUE, removed 2026-08-17. It used to default to
      # /var/lib/cxforge/zendesk-tokens.json, which made the store opt-OUT in
      # every container regardless of `.env` while its author had reported it as
      # opt-in. This is the same `:-`-default trap as the tunnel token below,
      # inverted: there a default hides a MISSING credential, here it silently
      # enabled a new behaviour. Three reasons it stays off until the owner asks:
      # it persists a live CREDENTIAL to a volume; it has a known unhandled
      # multi-writer race (`backend` and `worker` can both refresh — last write
      # wins); and whether to persist refresh tokens at all is a decision the
      # owner reserved (docs/BUILD-PLAN.md §10.7a).
      #
      # To turn it on, set in .env:
      #   ZENDESK_TOKEN_STORE=/var/lib/cxforge/zendesk-tokens.json
      # Unset is byte-for-byte the pre-store behaviour: refresh works once per
      # process, then needs `scripts/zendesk_oauth.py --serve`.
      ZENDESK_TOKEN_STORE: ${ZENDESK_TOKEN_STORE:-}
      ZENDESK_AI_USER_ID: ${ZENDESK_AI_USER_ID:-}
      ZENDESK_WEBHOOK_SIGNING_SECRET: ${ZENDESK_WEBHOOK_SIGNING_SECRET:-}
      # The agent graph (backend/src/agent/llm.py's AnthropicLLMClient) is
      # constructed lazily and never touches the network until a real
      # `.structured()` call, which nothing on the ingress path triggers
      # yet (see backend/src/ingress/__init__.py's module docstring) — so
      # an empty value still starts and serves /health. It is NOT optional
      # for real work, though: with it unset the first reply generation
      # fails, so a deploy meant to answer tickets must set it in .env.
      # (Was OPENAI_API_KEY before the provider pivot; the backend no
      # longer reads that name at all, so forwarding it deployed a stack
      # that could not reach the model.)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Embeddings (ADR-008 / W2-B1) ---
      # `backend/src/data/embeddings.py` reads BOTH of these itself, with
      # literal keys, so test_env_forwarding.py's AST scan requires them on
      # every service running this image and neither can be exempted away.
      # (This comment previously said the key was resolved by the `voyageai`
      # SDK; W2-B1 shipped an httpx client instead, so it is now an ordinary
      # os.environ read.)
      #
      # Empty default, like every other credential in this file: it reaches
      # the container either way, and `VoyageEmbedder` refuses to build
      # without it rather than silently degrading to the lexical embedder —
      # which would seed and query in two different embedding spaces.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # THIS IS THE SWITCH THAT PUTS PRODUCTION ON VOYAGE, and it is set to
      # the offline lexical embedder on purpose (docs/BUILD-PLAN.md §10.3).
      # `hashing` is also the code's own default, so an unset shell variable
      # and this line agree. Flipping it to `voyage` is only correct together
      # with a reseed of `kb_chunks` in the same maintenance window: the
      # stored vectors and the query vectors must come from one embedding
      # space, and a mismatch produces plausible nonsense rather than an
      # error — strictly worse than not flipping it at all.
      KB_EMBEDDER: ${KB_EMBEDDER:-hashing}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Broker for the arq queue (ADR-002). Pinned to the compose service
      # name `redis`, NOT `${REDIS_URL}`: the host's REDIS_URL in .env is
      # localhost-shaped, for a host-run dev process, and inside a container
      # localhost is the container itself. Same reasoning as DATABASE_URL
      # above. backend/tests/deploy/test_env_forwarding.py permits a literal
      # here only because it names a service defined in this file.
      REDIS_URL: redis://redis:6379/0
      # deploy/backend/bootstrap.py — see that file's docstring. The default
      # is `true`, which since 2026-08-16 means "seed only into an empty
      # database", NOT "truncate and reload on every restart". `.env` has no
      # SEED_ON_START line, so this default is what a droplet actually gets
      # even through deploy/compose.sh — which is precisely why the safe
      # behaviour had to become the default rather than a documented opt-in.
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      # Same volume, same path, on backend and worker: whichever process
      # refreshes first, the other reads the rotated pair rather than the
      # spent environment value.
      - deploy_zendesk_tokens:/var/lib/cxforge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - othram-deploy

  # --- Job queue broker (W1-F1, ADR-002) ---------------------------------
  # Deliberately used for nothing but the arq queue `cxforge:jobs`. Postgres
  # stays the system of record; nothing in this stack reads application state
  # from Redis. No `ports:` — it is reachable only from `backend` and
  # `worker` on the internal network, exactly like `db`.
  #
  # The named volume exists so a container restart does not silently drop a
  # queued job on the floor (a dropped job means a customer comment that is
  # never answered AND whose `tickets_seen` row is still present, so a retry
  # of the same webhook is treated as a duplicate). That is durability for
  # in-flight work, not a second system of record.
  redis:
    image: redis:7-alpine
    container_name: othram-deploy-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - deploy_redisdata:/data
    restart: unless-stopped
    networks:
      - othram-deploy

  # --- arq worker (W1-F1, ADR-002) ---------------------------------------
  # The SAME image as `backend`, with a different command. It consumes
  # `cxforge:jobs` and runs the agent; the frozen contract (docs/DESIGN.md
  # §1.1) is the arq task name `run_ticket` and the queue name
  # `cxforge:jobs`, both of which live in backend/src/worker/ (W1-A), not
  # here. The command string below is pinned by the owner and is identical
  # to the one W1-A was given.
  #
  # `entrypoint: []` resets the image's ENTRYPOINT (deploy/backend/
  # entrypoint.sh) so this container does NOT run the DB bootstrap. Exactly
  # one process owns schema creation and fixture seeding; `backend` does, and
  # `depends_on: backend: service_healthy` means the worker only starts after
  # that bootstrap has finished and uvicorn is answering /health. This is also
  # why `SEED_ON_START` is absent from this service and present on `backend` —
  # backend/tests/deploy/test_env_forwarding.py derives that distinction from
  # this `entrypoint:` key rather than from a hand-written list.
  #
  # THIS ALONE DOES NOT MAKE SEEDING SAFE, and an earlier revision of this
  # comment implied it did. It removes the second seeder. It does not stop the
  # first one: `backend` carries `restart: unless-stopped`, and a `depends_on`
  # condition orders `up` only — not a restart, not the daemon restoring
  # containers after a reboot. Any backend restart re-runs the bootstrap while
  # this worker is already consuming jobs. What actually closes that is
  # deploy/backend/bootstrap.py, which since 2026-08-16 seeds only into an
  # empty database unless SEED_ON_START=force; see its docstring and
  # backend/tests/deploy/test_bootstrap_seeding.py.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: othram-deploy-worker
    entrypoint: []
    command: ["arq", "worker.main.WorkerSettings"]
    # W3-G3, 2026-08-17. A container inherits the IMAGE's HEALTHCHECK unless
    # the service overrides it, and deploy/Dockerfile.backend's is an HTTP GET
    # to 127.0.0.1:8000/health. This container runs `arq`, serves no HTTP, and
    # therefore can NEVER pass it. Measured on the droplet during the redeploy:
    # `othram-deploy-worker` sat at `Up (unhealthy)`, FailingStreak 25,
    # `ConnectionRefusedError: [Errno 111]` on every probe — while it was in
    # fact connected to Redis and consuming `cxforge:jobs` — and
    # `deploy/compose.sh up -d --build --wait` exited **1** with "container
    # othram-deploy-worker is unhealthy" on an otherwise successful deploy. So
    # `--wait` could never succeed on this stack, and `docker compose ps`
    # reported a working service as broken. A permanently-red probe on a
    # healthy service is the same class of defect as a permanently-green one on
    # a broken service (docs/STATE.md §6.2): it makes the signal worthless.
    #
    # What replaces it: a probe for the health-check key `arq` writes into
    # Redis. It exits 0 only when that key is present, so it covers the
    # process having recorded health AND the broker link being usable
    # (measured on the droplet: key present -> 0; key deleted -> 1; REDIS_URL
    # pointed at a dead port -> ConnectionError, 1).
    #
    # NOT `arq --check`, which is the obvious choice and was tried first:
    # it imports `worker.main`, which pulls in langgraph/langchain/anthropic,
    # and took **16.5s** on this 2-vCPU droplet — over any sane healthcheck
    # timeout, and 16s of CPU every interval competing with the agent runs
    # this box exists to serve. The probe below imports only `redis` and
    # `worker.settings` and takes **1.8s**.
    #
    # It contains no string literals: the queue name comes from
    # `worker.settings.QUEUE_NAME` (the frozen contract, DESIGN §1.1) and the
    # suffix from `arq.constants.health_check_key_suffix`, so neither this file
    # nor arq's internal naming can drift away from the other. A hand-written
    # "cxforge:jobs:health-check" here would be a third copy of a string whose
    # whole point is that there is one.
    #
    # TWO THINGS IT DOES NOT PROVE, stated because both are easy to over-read.
    # (1) That runs SUCCEED. `backend/src/worker/main.py`'s `run_ticket`
    # swallows the exception after releasing the dedup row (ADR-003), so arq
    # books a failed run as `success = True`; this check stays green while
    # every run fails. Only `scripts/verify_deploy.sh --deep` fails when the
    # loop is severed. (2) That the worker is responsive *right now*. arq's
    # `health_check_interval` defaults to 3600s and it sets the key with a
    # TTL of interval+1, so a worker that hangs without exiting keeps a valid
    # key for up to an hour. A process that *exits* is caught immediately —
    # arq is this container's command, so it takes the container down with it.
    # Closing the hang window means setting `health_check_interval` on
    # `WorkerSettings` in `backend/src/worker/main.py`, which is W1-A's file in
    # the ownership matrix; flagged for the owner rather than taken here.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys;from arq.constants import health_check_key_suffix as s;from worker.settings import QUEUE_NAME,redis_url;from redis import Redis;sys.exit(0 if Redis.from_url(redis_url()).exists(QUEUE_NAME+s) else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-othram}:${POSTGRES_PASSWORD:-othram}@db:5432/${POSTGRES_DB:-othram}
      REDIS_URL: redis://redis:6379/0
      PORTAL_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_OAUTH_TOKEN: ${ZENDESK_OAUTH_TOKEN:-}
      # The worker is the container this matters most for: it is long-running
      # and `agent.nodes.ingest`'s first statement is a Zendesk fetch, so once
      # ZENDESK_OAUTH_TOKEN's 30 minutes are up EVERY run fails — and arq
      # books each swallowed failure as `success = True`, so nothing but the
      # ERROR log disagrees. These three let it renew instead.
      ZENDESK_OAUTH_REFRESH_TOKEN: ${ZENDESK_OAUTH_REFRESH_TOKEN:-}
      ZENDESK_OAUTH_CLIENT_ID: ${ZENDESK_OAUTH_CLIENT_ID:-}
      ZENDESK_OAUTH_CLIENT_SECRET: ${ZENDESK_OAUTH_CLIENT_SECRET:-}
      # ...and this is what WOULD make "renew" survive more than one job:
      # `run_ticket` builds a fresh ZendeskAdapter per job, so without the store
      # the rotated refresh token dies with the job that earned it (measured
      # 2026-08-17). It is forwarded and EMPTY — the `:-` default value was
      # removed 2026-08-17 so the store is genuinely opt-in. Full reasoning on
      # `backend` above; the decision is docs/BUILD-PLAN.md §10.7a.
      ZENDESK_TOKEN_STORE: ${ZENDESK_TOKEN_STORE:-}
      ZENDESK_AI_USER_ID: ${ZENDESK_AI_USER_ID:-}
      ZENDESK_WEBHOOK_SIGNING_SECRET: ${ZENDESK_WEBHOOK_SIGNING_SECRET:-}
      # NOT optional for the worker, unlike for `backend`: this container's
      # entire job is to call the model. An empty value here is a worker
      # that accepts jobs and fails every one of them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Embeddings (ADR-008 / W2-B1) — see `backend` above for the full note.
      # Retrieval runs HERE, in the worker: `agent.nodes.kb_answer` calls
      # `data.retrieval.search_kb`, which resolves its embedder through
      # `default_embedder()`. So this service, not just the seeder, needs
      # both, and the two must agree with `backend`'s values or the reseed
      # and the queries end up in different embedding spaces.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      KB_EMBEDDER: ${KB_EMBEDDER:-hashing}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # Same volume and path as `backend` — see that service and the
      # deploy_zendesk_tokens volume definition.
      - deploy_zendesk_tokens:/var/lib/cxforge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - othram-deploy

  # --- Cloudflare named tunnel (W1-F2, ADR-005) --------------------------
  # UNVERIFIED AGAINST A LIVE TUNNEL — still true, but for a narrower reason
  # than when this was written. OA-3 has since been completed: the token is in
  # .env and PUBLIC_BASE_URL=https://cxforge.hankholcomb.com. Measured
  # 2026-08-16 from outside the droplet:
  #     GET https://cxforge.hankholcomb.com/health -> HTTP/2 502, server: cloudflare
  # DNS resolves to Cloudflare anycast and the edge terminates TLS, so the
  # hostname is real. The 502 is the edge failing to reach an origin, which is
  # correct — this service has never been started. Nothing here has carried a
  # request to `backend:8000`, and only W3-G3 can establish that.
  #
  # Transport: the tunnel dials OUT to Cloudflare, so the droplet opens no
  # inbound port. The public hostname terminates at `backend:8000` — the
  # compose service name, resolved on this network — which is why `backend`'s
  # published `${BACKEND_PORT}` is not what the internet reaches.
  #
  # Where the ingress rule lives: this is a *token*-managed (dashboard-
  # managed) named tunnel, so the hostname -> `http://backend:8000` mapping
  # is configured in the Cloudflare dashboard and delivered with the token.
  # cloudflared ignores a local `ingress:` block in that mode, so committing
  # one here would be a file that looks like configuration and configures
  # nothing. The committed artifact is deploy/cloudflared/README.md, which
  # records the exact rule to set and is asserted by
  # backend/tests/deploy/test_compose_topology.py so it cannot drift.
  #
  # Why `${CLOUDFLARE_TUNNEL_TOKEN}` with NO `:-` default: `:-` would render
  # an empty string and start a cloudflared that serves nothing while looking
  # up. With no default, `docker compose` prints a "variable is not set"
  # warning and cloudflared exits non-zero at startup. Once OA-3 lands and the
  # token is a hard requirement, changing `${CLOUDFLARE_TUNNEL_TOKEN}` to
  # `${CLOUDFLARE_TUNNEL_TOKEN:?set it — see docs/OWNER-ACTIONS.md OA-3}`
  # upgrades that warning to a hard parse failure. It is deliberately NOT
  # written that way today: `:?` fails interpolation for the WHOLE file, for
  # every service, including `scripts/verify_deploy.sh --local`, which would
  # make an owner action nobody has taken yet block work that does not need
  # it.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: othram-deploy-cloudflared
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      # cloudflared reads the token from TUNNEL_TOKEN natively, so it never
      # appears in the process's argv (where `docker inspect`/`ps` would
      # print it).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    # No healthcheck: the image ships no shell and no wget/curl, so a
    # container-local probe is not expressible. cloudflared serves
    # http://<container>:2000/ready on the metrics port above — W3-G3 must
    # read that back (or fetch ${PUBLIC_BASE_URL}/health from outside the
    # droplet) rather than trust that this container is "running".
    restart: unless-stopped
    networks:
      - othram-deploy

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.portal
      args:
        # Build-time only — see deploy/Dockerfile.portal's header comment
        # for why this can't be a runtime `environment:` entry and the
        # security implication of it landing in the shipped JS bundle.
        VITE_PORTAL_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
    container_name: othram-deploy-portal
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - othram-deploy

volumes:
  deploy_pgdata:
    name: othram-deploy-pgdata
  deploy_redisdata:
    name: othram-deploy-redisdata
  # Where the rotated Zendesk token pair would live (ZENDESK_TOKEN_STORE).
  # Shared by `backend` and `worker` and named, so it survives
  # `up -d --force-recreate`. **Unused as shipped:** ZENDESK_TOKEN_STORE has no
  # default value, so nothing writes here until the owner sets it. The mount and
  # the volume stay declared so opting in is a one-line `.env` change.
  #
  # Known and unhandled if it IS enabled: both `backend` and `worker` can
  # refresh, and the store has no locking — last write wins, and the loser has
  # spent a refresh token Zendesk has already invalidated.
  #
  # WHY A VOLUME AND NOT JUST AN ENV VAR. Zendesk rotates the refresh token
  # every time it is spent and invalidates the previous value. Measured on the
  # droplet 2026-08-17: the worker refreshed once, and because
  # `worker.main.run_ticket` builds a fresh `ZendeskAdapter()` per job, the
  # rotated value went out of scope with that job — the next job re-read the
  # spent value from the environment and every run 401'd at `fetch_ticket`.
  # `ZENDESK_OAUTH_REFRESH_TOKEN` on its own is therefore a single-use
  # credential this stack burns ~30 minutes after boot, recoverable only by a
  # human at a browser (`scripts/zendesk_oauth.py --serve`).
  deploy_zendesk_tokens:
    name: othram-deploy-zendesk-tokens

networks:
  othram-deploy:
    name: othram-deploy
