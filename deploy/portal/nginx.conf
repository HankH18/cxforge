# Static file server + reverse proxy for the built portal (T-11).
#
# Serves the Vite build output (`dist/`) and proxies `/api/` and
# `/webhooks/` to the `backend` service by its docker-compose service
# name (see deploy/docker-compose.yml — both containers share the
# `othram-deploy` network, so `backend` resolves via Docker's embedded
# DNS). This lets the portal keep making same-origin relative fetches
# (`portal/src/api.ts` calls `/api/...`, exactly as the Vite dev proxy in
# `portal/vite.config.ts` already does) and gives the whole stack a
# single public port (80) to open in a droplet firewall — the Zendesk
# webhook can point at this same host, path `/webhooks/zendesk`, instead
# of requiring the backend's own port to be reachable from the internet
# too (see docs/deploy.md for both options).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11 on every user-defined bridge
    # network — this container's default resolv.conf already points
    # here, but nginx needs it named explicitly). Combined with the
    # `set $backend ...; proxy_pass http://$backend/...` variable
    # indirection below, this makes nginx resolve `backend` PER REQUEST
    # instead of once at config-load time. Without this, a bare
    # `proxy_pass http://backend:8000/...;` fails nginx's startup
    # entirely ("host not found in upstream") any time nginx starts (or
    # reloads) before the `backend` service is resolvable — observed
    # directly while building this image: running the portal container
    # alone, with no `backend` on the network, refused to start at all.
    # With the resolver + variable form, nginx starts regardless, and
    # only in-flight proxied requests 502 until `backend` resolves —
    # exactly the "sensible restart policy" behavior wanted here: the
    # portal keeps serving its static index even if the backend
    # container is mid-restart.
    # NOTE on the bare `proxy_pass http://$backend_upstream;` below (no
    # trailing path): with a VARIABLE upstream, nginx cannot compute the
    # usual "replace the matched location prefix with the URI in
    # proxy_pass" rewrite at config-load time (that rewrite requires a
    # literal, static proxy_pass target) — it falls back to forwarding
    # the client's ORIGINAL request URI unchanged. A `.../api/` suffix
    # here would be silently ignored, not appended, which is exactly what
    # broke this the first time it was written (verified against a real
    # running stack: `/api/metrics` came back 404 with `proxy_pass
    # http://$backend_upstream/api/;`, and 200/401 as expected once the
    # trailing path was dropped). Since the incoming URI (`/api/metrics`,
    # `/webhooks/zendesk`, `/health`) already matches the backend's own
    # route prefixes exactly (`backend/src/main.py` mounts `portal_router`
    # at `/api` and `ingress_router` at `/webhooks`), forwarding it
    # unchanged is exactly correct here.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream backend:8000;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://$backend_upstream;
    }

    # SPA fallback: any other path serves index.html so client-side
    # routing (if the portal ever grows any) and a hard refresh both
    # resolve, rather than a bare-file 404 from nginx.
    location / {
        try_files $uri /index.html;
    }
}
