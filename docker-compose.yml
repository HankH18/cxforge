# Dev stack. The production stack is deploy/docker-compose.yml.
#
# `db` is what the test suite points at and is unchanged. `redis` + `worker`
# were added by W1-F1 (ADR-002) so the ingress -> queue -> agent loop can be
# exercised locally, not only on the droplet.
#
# NOTE ON THE DOCUMENTED DEV COMMAND. README.md says `docker compose up -d db`
# — it names the service, so it still starts Postgres alone and nothing here
# changes that. A bare `docker compose up -d` now also builds the backend
# image and starts redis + worker. That is deliberate (the loop should be
# runnable locally), but it is a behaviour change worth knowing about.
#
# ENV: every `${VAR}` below comes from the shell `docker compose` runs in.
# `.env` is NOT auto-read for these — run
#     set -a; source .env; set +a
# first, or each `${VAR}` silently falls back to its `:-` default here.
# (docs/deploy.md:151 says the same thing about the production stack; this is
# the same trap in the dev one.)

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: othram-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-othram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-othram}
      POSTGRES_DB: ${POSTGRES_DB:-othram}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-othram} -d ${POSTGRES_DB:-othram}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Broker for the arq job queue (ADR-002). Deliberately used for nothing
  # else: Postgres stays the system of record. The host port is published so
  # a host-run uvicorn/arq (the normal dev shape) can reach it.
  redis:
    image: redis:7-alpine
    container_name: othram-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - redisdata:/data

  # Same image as the production backend, different command (ADR-002).
  # The image's ENTRYPOINT (deploy/backend/entrypoint.sh) runs the DB
  # bootstrap and then execs this command — kept here, unlike in the
  # production stack, because the dev stack has no backend container to
  # create the schema first.
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: othram-worker
    command: ["arq", "worker.main.WorkerSettings"]
    # Same override, and for the same reason, as the production stack's worker
    # — see deploy/docker-compose.yml for the full note. Short version: this
    # container inherits deploy/Dockerfile.backend's HEALTHCHECK, an HTTP GET
    # to 127.0.0.1:8000/health that an `arq` process can never answer, so
    # without this override the worker reports `unhealthy` forever and
    # `docker compose up --wait` exits non-zero on a working stack. The probe
    # checks for the health-check key arq writes into Redis — liveness of the
    # broker link, nothing about whether runs succeed (`run_ticket` swallows
    # failures; see its docstring) and nothing about a hung model call, which
    # keeps the key fresh because `record_health` runs on the event loop while
    # `run_agent` runs in a thread. It IS timely about a stopped loop or a lost
    # Redis link: `WorkerSettings.health_check_interval` is 30s (was arq's
    # 3600s default until 2026-08-17), matched to the `interval:` below so a
    # stale key cannot outlive one probe window — `docs/BUILD-PLAN.md §10.7f`
    # and the comment on `HEALTH_CHECK_INTERVAL_SECONDS`. It carries no string
    # literals: the key is assembled from `worker.settings.QUEUE_NAME` and
    # `arq.constants.health_check_key_suffix`.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys;from arq.constants import health_check_key_suffix as s;from worker.settings import QUEUE_NAME,redis_url;from redis import Redis;sys.exit(0 if Redis.from_url(redis_url()).exists(QUEUE_NAME+s) else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # Built from the POSTGRES_* parts against the `db` service, NOT from
      # the host's DATABASE_URL: that one points at localhost:5432 for a
      # host-run process, which inside this container is the container's own
      # loopback. Same reasoning as deploy/docker-compose.yml.
      DATABASE_URL: postgresql://${POSTGRES_USER:-othram}:${POSTGRES_PASSWORD:-othram}@db:5432/${POSTGRES_DB:-othram}
      # Likewise pinned to the compose service name `redis`, NOT
      # `${REDIS_URL}`: the host's REDIS_URL is localhost-shaped (for a
      # host-run process) and would resolve to this container's own
      # loopback. backend/tests/deploy/test_env_forwarding.py allows a
      # literal here precisely because it names a service in this file.
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_OAUTH_TOKEN: ${ZENDESK_OAUTH_TOKEN:-}
      # The access token above expires 30 minutes after issue, so these three
      # are what let a long-running container renew it by itself
      # (backend/src/helpdesk/zendesk_credentials.py). Without them a worker
      # is useful for one 30-minute window and then 401s every run while
      # still looking healthy to `docker compose ps`.
      ZENDESK_OAUTH_REFRESH_TOKEN: ${ZENDESK_OAUTH_REFRESH_TOKEN:-}
      ZENDESK_OAUTH_CLIENT_ID: ${ZENDESK_OAUTH_CLIENT_ID:-}
      ZENDESK_OAUTH_CLIENT_SECRET: ${ZENDESK_OAUTH_CLIENT_SECRET:-}
      # ...and this is what WOULD make the renewal survive more than one job.
      # Zendesk rotates the refresh token on every spend, and
      # `worker.main.run_ticket` builds a fresh ZendeskAdapter per job — so
      # without a store the rotated value dies with the job that earned it and
      # the next job spends the invalidated one (measured 2026-08-17).
      #
      # NO `:-` DEFAULT VALUE, and there never has been one in a released
      # version. While this feature was being built it read
      # `${ZENDESK_TOKEN_STORE:-/var/lib/cxforge/zendesk-tokens.json}`, which
      # made the store opt-OUT in every container while its author reported it
      # as opt-in (true only for a host-run process, where the variable really
      # is unset). That was caught in the working tree and removed on
      # 2026-08-17 before the first commit, so it never entered git history:
      # `git log -S ZENDESK_TOKEN_STORE` shows one commit, and the value is
      # already empty there. It is forwarded —
      # backend/tests/deploy/test_env_forwarding.py requires that, because the
      # application reads the name — and empty, so the store stays dormant.
      # Reasons it stays off until the owner asks: it persists a live CREDENTIAL
      # to a volume; it has a known unhandled multi-writer race (`backend` and
      # `worker` can both refresh, last write wins); and refresh-token
      # persistence is a decision the owner reserved (docs/BUILD-PLAN.md §10.7a).
      # Turn it on with ZENDESK_TOKEN_STORE=/var/lib/cxforge/zendesk-tokens.json
      # in .env; the volume below is already mounted for it.
      ZENDESK_TOKEN_STORE: ${ZENDESK_TOKEN_STORE:-}
      ZENDESK_AI_USER_ID: ${ZENDESK_AI_USER_ID:-}
      ZENDESK_WEBHOOK_SIGNING_SECRET: ${ZENDESK_WEBHOOK_SIGNING_SECRET:-}
      PORTAL_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
      # --- Embeddings (ADR-008 / W2-B1) ---
      # `backend/src/data/embeddings.py` reads BOTH of these itself, with
      # literal keys, so test_env_forwarding.py's AST scan requires them here
      # and neither can be exempted away. (This comment previously said the
      # key was resolved by the `voyageai` SDK; W2-B1 shipped an httpx client
      # instead, so it is an ordinary os.environ read now.)
      #
      # Empty default, like every other credential in this file: it reaches
      # the container either way, and `VoyageEmbedder` refuses to build
      # without it rather than degrading to the lexical embedder.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # `hashing` is the offline lexical embedder and the code's own default,
      # so an unset shell variable leaves this stack exactly where it is.
      # Setting `voyage` REQUIRES reseeding the KB in the same run — the
      # stored vectors and the query vectors must come from one embedding
      # space, and a mismatch returns confident nonsense rather than an
      # error. See docs/BUILD-PLAN.md §10.3.
      KB_EMBEDDER: ${KB_EMBEDDER:-hashing}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Defaults to FALSE here, unlike the production stack, and the asymmetry
      # is deliberate — backend/tests/deploy/test_compose_topology.py pins both
      # halves so neither drifts by accident. This `db` is `othram-db`, the
      # container the whole test suite runs against, and its `public` schema
      # holds whatever the developer seeded by hand. A bare
      # `docker compose up -d` has no business rewriting that; the suite is
      # insulated by per-process OTHRAM_TEST_SCHEMA schemas, but the
      # developer's own data is not. Seed the dev database deliberately
      # (`uv run python -m data.seed`), not as a side effect of starting a
      # worker. `false` still creates the schema if it is missing.
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      # Where the ROTATED Zendesk token pair would be persisted
      # (ZENDESK_TOKEN_STORE above). Mounted unconditionally, but unused until
      # that variable is set — the mount is cheap and makes opting in a
      # one-line .env change rather than a compose edit.
      - zendesk_tokens:/var/lib/cxforge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  zendesk_tokens:
