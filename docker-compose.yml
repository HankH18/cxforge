services:
  db:
    image: pgvector/pgvector:pg16
    container_name: othram-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-othram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-othram}
      POSTGRES_DB: ${POSTGRES_DB:-othram}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-othram} -d ${POSTGRES_DB:-othram}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
